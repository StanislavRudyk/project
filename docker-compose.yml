services:
  db:
    image: postgres:17-alpine
    container_name: bookshare_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookshare}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookshare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: bookshare_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bookshare.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bookshare_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      DatabaseSettings__ConnectionString: >-
        Host=db;
        Port=5432;
        Database=${POSTGRES_DB:-bookshare};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-postgres}

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: localhost:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-bookshare}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-bookshare_password}
      Minio__BucketName: bookshare
      Minio__UseSsl: false

    ports:
      - "5000:8080"
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookshare_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  
  minio:
    image: minio/minio
    container_name: bookshare-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bookshare
      MINIO_ROOT_PASSWORD: bookshare_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
